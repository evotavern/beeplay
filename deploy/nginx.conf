# /etc/nginx/sites-available/beeplay
#
# The default virtual host accepts direct requests to the server's public IP.
# FastAPI listens only on localhost; Nginx owns port 80 and serves immutable
# game artifacts and static assets without involving uvicorn.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /assets/ {
        root /srv/beeplay;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /games/ {
        alias /var/lib/beeplay/games/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
