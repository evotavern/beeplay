      <section class="view active" id="homeView" data-view="home">
        <div class="home-feed" id="homeFeed" aria-label="可上下滑动的游戏流">
          {% for game in games %}
          <article class="game-card game-{{ game.art }}" data-game-title="{{ game.title }}" data-artifact="{{ game.artifact_hash }}">
            <div class="game-card-head"><span class="game-badge">FOR YOU · {{ '%02d'|format(loop.index) }}</span><button class="game-more" data-toast="更多游戏选项已打开" aria-label="更多选项">⋯</button></div>
            <div class="game-scene" aria-hidden="true">
              <span class="scene-sun"></span><span class="scene-ground"></span><span class="scene-piece emoji">{{ game.emoji }}</span>
            </div>
            <div class="game-copy"><h2>{{ game.title }}</h2><p>{{ game.category }} · 互动小游戏</p><div class="game-author">{{ game.author }}</div></div>
            <div class="game-actions">
              <button class="game-action play-game" data-game-action="play" aria-label="试玩 {{ game.title }}">▶</button>
              <button class="game-action" data-game-action="like" aria-label="喜欢 {{ game.title }}">♥<small>{{ game.likes }}</small></button>
              <button class="game-action" data-game-action="save" aria-label="收藏 {{ game.title }}">▣</button>
              <button class="game-action" data-game-action="share" aria-label="分享 {{ game.title }}">↗</button>
            </div>
          </article>
          {% else %}
          <div class="feed-empty" role="status">暂时没有可玩的游戏</div>
          {% endfor %}
        </div>
      </section>
