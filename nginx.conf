server {
    listen 80;
    server_name _;                    # accepts the bare public IP, domain-ready later

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location /assets/ {
        expires 7d;                   # icons/logos are stable
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";   # prototype iterates fast
    }
}

