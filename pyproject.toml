[project]
name = "beeplay"
version = "0.1.0"
description = "Beeplay / 蜂玩 — FastAPI + Jinja port of the interactive game feed"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
