<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b6d95b" />
  <title>Beeplay / 蜂玩</title>
  <style>
    :root {
      --lime: #b5d65a;
      --lime-dark: #97bd38;
      --lime-light: #dff0bb;
      --mint: #eef9df;
      --cream: #f8fbe8;
      --ink: #171b1a;
      --ink-soft: #2f3531;
      --muted: #6d766e;
      --line: rgba(23, 27, 26, 0.14);
      --white: #ffffff;
      --orange: #f27c45;
      --lavender: #d8d6ff;
      --shadow: 0 22px 60px rgba(48, 62, 18, 0.14);
      --radius-xl: 36px;
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--lime);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }

    .app-shell {
      min-height: 100dvh;
      padding: 24px 24px 36px;
    }

    .topbar {
      width: min(1380px, 100%);
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      border: 0;
      background: transparent;
      padding: 0;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--lime);
      box-shadow: 0 12px 22px rgba(23, 27, 26, 0.13);
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
    .brand-copy { display: grid; gap: 1px; text-align: left; }
    .brand-copy strong { font-size: 21px; letter-spacing: -0.03em; line-height: 1; }
    .brand-copy span { color: rgba(23, 27, 26, 0.62); font-size: 12px; font-weight: 700; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      margin-right: 8px;
      padding: 5px;
      border: 1px solid rgba(23, 27, 26, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
    }
    .desktop-nav button {
      min-height: 38px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      background: transparent;
      color: rgba(23, 27, 26, 0.64);
      font-size: 13px;
      font-weight: 850;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }
    .desktop-nav button:hover {
      transform: translateY(-1px);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
    }
    .desktop-nav button.active {
      color: var(--white);
      background: var(--ink);
    }
    .desktop-create {
      display: none;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      margin-left: 4px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .desktop-create:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(181, 214, 90, 0.28);
    }
    .icon-button,
    .avatar-button,
    .credit-pill {
      border: 1px solid rgba(23, 27, 26, 0.15);
      background: rgba(255, 255, 255, 0.36);
      color: var(--ink);
      min-height: 46px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .icon-button { width: 46px; padding: 0; }
    .icon-button:hover, .avatar-button:hover, .credit-pill:hover { transform: translateY(-2px); background: rgba(255,255,255,0.62); }
    .avatar-button { width: 46px; padding: 0; overflow: hidden; }
    .avatar-button img { width: 100%; height: 100%; object-fit: cover; }
    .credit-pill { gap: 8px; padding: 0 14px; font-weight: 800; }
    .credit-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--lime);
      font-size: 12px;
    }

    .page {
      width: min(1380px, 100%);
      margin: 0 auto;
    }
    .view { display: none; animation: pageIn 360ms ease both; }
    .view.active { display: block; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.36fr) minmax(330px, 0.64fr);
      gap: 22px;
      align-items: stretch;
    }
    .panel {
      background: var(--cream);
      border: 1px solid rgba(255,255,255,0.52);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero-panel {
      min-height: 690px;
      padding: clamp(30px, 5vw, 76px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-panel::after {
      content: "";
      position: absolute;
      right: 32px;
      top: 32px;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 25% 35%, rgba(255,255,255,0.8) 0 3px, transparent 4px),
        radial-gradient(circle at 65% 70%, rgba(255,255,255,0.7) 0 3px, transparent 4px),
        rgba(181, 214, 90, 0.34);
      opacity: 0.8;
      pointer-events: none;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .hero-title {
      max-width: 700px;
      margin: 18px 0 16px;
      font-size: 86px;
      letter-spacing: -0.075em;
      line-height: 0.95;
    }
    .hero-title em { color: var(--lime-dark); font-style: normal; }
    .hero-description {
      max-width: 555px;
      margin: 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.55;
    }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 28px; }
    .primary-button,
    .secondary-button {
      min-height: 52px;
      border-radius: 999px;
      padding: 0 20px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 850;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .primary-button { background: var(--ink); color: var(--white); box-shadow: 0 14px 22px rgba(23,27,26,0.13); }
    .secondary-button { background: transparent; color: var(--ink); border-color: var(--line); }
    .primary-button:hover, .secondary-button:hover { transform: translateY(-2px); }
    .primary-button .button-arrow { color: var(--lime); font-size: 18px; }

    .mascot-stage {
      min-height: 270px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .mascot {
      width: min(320px, 54vw);
      aspect-ratio: 0.88;
      position: relative;
      filter: drop-shadow(0 20px 12px rgba(38, 57, 16, 0.16));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    .bee-body {
      position: absolute;
      left: 22%;
      top: 19%;
      width: 56%;
      height: 67%;
      background: var(--ink);
      border-radius: 49% 49% 42% 42% / 36% 36% 56% 56%;
      z-index: 2;
    }
    .bee-body::before,
    .bee-body::after {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      height: 20%;
      border-radius: 50%;
      background: var(--lime);
    }
    .bee-body::before { top: 33%; }
    .bee-body::after { top: 68%; background: var(--orange); }
    .bee-face {
      position: absolute;
      left: 16%;
      top: 13%;
      width: 68%;
      height: 34%;
      border-radius: 50%;
      background: var(--cream);
      z-index: 3;
    }
    .bee-eye { position: absolute; top: 41%; width: 15%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); }
    .bee-eye.left { left: 27%; }
    .bee-eye.right { right: 27%; }
    .bee-smile {
      position: absolute;
      left: 37%;
      top: 62%;
      width: 26%;
      height: 19%;
      border-bottom: 4px solid var(--ink);
      border-radius: 50%;
    }
    .wing {
      position: absolute;
      top: 23%;
      width: 36%;
      height: 40%;
      border-radius: 55% 45% 60% 40%;
      background: rgba(255,255,255,0.82);
      border: 7px solid var(--lime-light);
      z-index: 1;
    }
    .wing.left { left: 2%; transform: rotate(-28deg); }
    .wing.right { right: 2%; transform: scaleX(-1) rotate(-28deg); }
    .bee-antenna {
      position: absolute;
      top: 0;
      width: 12%;
      height: 17%;
      border-top: 6px solid var(--ink);
      z-index: 4;
    }
    .bee-antenna::after {
      content: "";
      position: absolute;
      width: 12px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--orange);
      top: -10px;
    }
    .bee-antenna.left { left: 28%; transform: rotate(-24deg); }
    .bee-antenna.left::after { left: -5px; }
    .bee-antenna.right { right: 28%; transform: rotate(24deg); }
    .bee-antenna.right::after { right: -5px; }
    .bee-foot { position: absolute; bottom: 7%; width: 18%; height: 12%; border-radius: 50%; background: var(--orange); z-index: 1; }
    .bee-foot.left { left: 28%; transform: rotate(12deg); }
    .bee-foot.right { right: 28%; transform: rotate(-12deg); }
    .play-badge {
      position: absolute;
      right: 2%;
      bottom: 15%;
      width: 70px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--lime);
      border: 9px solid var(--cream);
      display: grid;
      place-items: center;
      z-index: 4;
      transform: rotate(10deg);
    }
    .play-badge::after { content: ""; border-left: 18px solid var(--ink); border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }

    .dashboard-panel { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .welcome-row { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--lime); }
    .welcome-copy { flex: 1; }
    .welcome-copy strong { display: block; font-size: 18px; }
    .welcome-copy span { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
    .mini-action { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--white); border-radius: 50%; display: grid; place-items: center; }
    .daily-card { background: var(--ink); color: var(--white); border-radius: 24px; padding: 20px; }
    .daily-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .daily-head strong { font-size: 20px; }
    .toggle { width: 44px; height: 26px; background: var(--lime); border-radius: 999px; padding: 3px; }
    .toggle::after { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--white); margin-left: auto; }
    .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 18px; }
    .day {
      min-width: 0;
      padding: 7px 2px 9px;
      border-radius: 15px;
      background: #303632;
      display: grid;
      justify-items: center;
      gap: 5px;
      color: #bfc5bf;
      font-size: 10px;
    }
    .day.done { background: var(--white); color: var(--ink); }
    .day.active { background: var(--lime); color: var(--ink); }
    .day-mark { font-size: 15px; font-weight: 900; line-height: 1; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric-card { min-height: 138px; padding: 18px; border-radius: 24px; background: var(--lime); display: flex; flex-direction: column; justify-content: space-between; }
    .metric-card.dark { background: var(--ink); color: var(--white); position: relative; overflow: hidden; }
    .metric-card.dark::after { content: "✦"; position: absolute; right: 15px; bottom: -8px; font-size: 88px; color: var(--orange); transform: rotate(-16deg); }
    .metric-label { font-size: 14px; font-weight: 800; }
    .metric-value { font-size: 42px; letter-spacing: -0.08em; line-height: 0.9; }
    .metric-note { font-size: 12px; color: var(--muted); }
    .metric-card.dark .metric-note { color: rgba(255,255,255,0.66); }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 15px; }
    .section-heading h2 { margin: 0; font-size: 25px; letter-spacing: -0.04em; }
    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .section-heading button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 800; }
    .task-card { padding: 16px; border-radius: 24px; background: var(--white); border: 1px solid rgba(23,27,26,0.08); }
    .task-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .task-top strong { font-size: 15px; }
    .task-progress { color: var(--muted); font-size: 12px; font-weight: 800; }
    .task-bar { height: 8px; border-radius: 999px; background: var(--lime-light); overflow: hidden; }
    .task-bar span { display: block; width: 68%; height: 100%; border-radius: inherit; background: var(--ink); }
    .task-list { display: grid; gap: 8px; margin-top: 12px; }
    .task-row { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .task-row button { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--lime-dark); background: var(--lime); color: var(--ink); display: grid; place-items: center; padding: 0; font-size: 12px; }
    .task-row.complete span { text-decoration: line-through; opacity: 0.56; }

    .view-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .view-header h1 { margin: 0; font-size: 58px; letter-spacing: -0.065em; line-height: 1; }
    .view-header p { max-width: 480px; margin: 8px 0 0; color: rgba(23,27,26,0.68); line-height: 1.5; }
    .search-box { display: flex; align-items: center; gap: 12px; width: min(420px, 100%); min-height: 55px; padding: 0 17px; background: rgba(255,255,255,0.48); border: 1px solid rgba(23,27,26,0.16); border-radius: 999px; }
    .search-box input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .search-box input::placeholder { color: rgba(23,27,26,0.52); }

    .discover-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr); gap: 22px; }
    .feature-card { min-height: 420px; padding: 26px; border-radius: var(--radius-xl); background: var(--ink); color: var(--white); position: relative; overflow: hidden; }
    .feature-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg, rgba(181,214,90,0.45), transparent 44%),
        radial-gradient(circle at 75% 35%, rgba(242,124,69,0.9) 0 5%, transparent 6%),
        linear-gradient(125deg, transparent 0 50%, rgba(255,255,255,0.08) 50% 50.6%, transparent 50.6% 100%);
      opacity: 0.8;
    }
    .feature-content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .chip { display: inline-flex; align-items: center; width: max-content; padding: 7px 11px; background: var(--lime); color: var(--ink); border-radius: 999px; font-size: 12px; font-weight: 900; }
    .feature-title { max-width: 500px; margin: auto 0 8px; font-size: 68px; letter-spacing: -0.075em; line-height: 0.94; }
    .feature-meta { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.74); font-size: 14px; }
    .mini-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .feature-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; }
    .feature-stats { display: flex; flex-wrap: wrap; gap: 12px; color: rgba(255,255,255,0.7); font-size: 12px; }
    .feature-cta { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--white); color: var(--ink); border: 0; font-weight: 850; }
    .promo-card { padding: 25px; border-radius: var(--radius-xl); background: var(--lavender); min-height: 420px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .promo-card::after { content: "✳"; position: absolute; right: 16px; bottom: -32px; font-size: 190px; color: rgba(255,255,255,0.56); transform: rotate(15deg); }
    .promo-card h2 { max-width: 320px; margin: 16px 0 0; font-size: 50px; letter-spacing: -0.07em; line-height: 0.98; position: relative; z-index: 1; }
    .promo-card p { max-width: 290px; color: rgba(23,27,26,0.65); line-height: 1.5; position: relative; z-index: 1; }
    .promo-card .secondary-button { width: max-content; position: relative; z-index: 1; }
    .category-section { margin-top: 24px; }
    .category-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 0 10px; }
    .category-row::-webkit-scrollbar { display: none; }
    .category-pill { flex: 0 0 auto; min-height: 42px; border: 1px solid rgba(23,27,26,0.14); border-radius: 999px; background: rgba(255,255,255,0.36); color: var(--ink); padding: 0 16px; font-weight: 800; }
    .category-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
    .work-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .work-card { border-radius: var(--radius-lg); background: var(--cream); padding: 10px; box-shadow: 0 10px 30px rgba(48,62,18,0.09); transition: transform 160ms ease, box-shadow 160ms ease; }
    .work-card:hover { transform: translateY(-5px); box-shadow: 0 16px 36px rgba(48,62,18,0.15); }
    .work-art { aspect-ratio: 0.9; border-radius: 21px; overflow: hidden; position: relative; display: grid; place-items: center; }
    .work-art.art-one { background: #c7e596; }
    .work-art.art-two { background: #d5d2ff; }
    .work-art.art-three { background: #ffd39c; }
    .work-art.art-four { background: #cbe8e6; }
    .work-art span { font-size: 74px; filter: drop-shadow(0 10px 4px rgba(23,27,26,0.13)); }
    .work-art::after { content: "PLAY"; position: absolute; right: 10px; bottom: 10px; padding: 6px 8px; border-radius: 9px; background: var(--ink); color: var(--white); font-size: 9px; font-weight: 900; letter-spacing: 0.06em; }
    .work-copy { padding: 12px 5px 5px; }
    .work-copy strong { display: block; font-size: 15px; }
    .work-copy span { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    .work-stats { display: flex; gap: 10px; color: var(--muted); font-size: 11px; margin-top: 9px; }

    .create-layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 22px; align-items: start; }
    .create-panel { padding: clamp(24px, 4vw, 48px); background: var(--cream); border-radius: var(--radius-xl); box-shadow: var(--shadow); }
    .create-panel h1 { max-width: 700px; margin: 0; font-size: 76px; letter-spacing: -0.08em; line-height: 0.94; }
    .create-panel > p { max-width: 650px; color: var(--muted); line-height: 1.6; margin: 18px 0 28px; }
    .idea-box { min-height: 260px; padding: 20px; border: 2px solid var(--line); border-radius: var(--radius-lg); background: var(--white); display: flex; flex-direction: column; }
    .idea-box textarea { min-height: 155px; flex: 1; resize: none; border: 0; outline: 0; font-size: 34px; line-height: 1.15; color: var(--ink); background: transparent; letter-spacing: -0.045em; }
    .idea-box textarea::placeholder { color: rgba(23,27,26,0.34); }
    .idea-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .idea-tools { display: flex; gap: 8px; }
    .tool-button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--cream); display: grid; place-items: center; color: var(--ink); }
    .tool-button.active { background: var(--lime); border-color: var(--lime); }
    .idea-submit { width: 50px; height: 50px; border: 0; border-radius: 50%; background: var(--ink); color: var(--lime); display: grid; place-items: center; font-size: 22px; }
    .tool-strip { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 6px; scrollbar-width: none; }
    .tool-strip::-webkit-scrollbar { display: none; }
    .tool-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 16px; background: var(--lime-light); color: var(--ink); font-weight: 800; border: 1px solid transparent; }
    .tool-chip:hover { border-color: var(--lime-dark); }
    .inspiration-list { display: grid; gap: 13px; }
    .inspiration-card { display: flex; align-items: center; gap: 13px; padding: 12px; background: var(--white); border-radius: 20px; border: 1px solid rgba(23,27,26,0.08); }

    .inspiration-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .remix-button { border: 0; border-radius: 999px; background: var(--ink); color: var(--white); padding: 9px 12px; font-size: 12px; font-weight: 800; }
    .credit-card { background: var(--ink); color: var(--white); border-radius: var(--radius-xl); padding: 25px; }
    .credit-card strong { display: block; font-size: 25px; letter-spacing: -0.04em; }
    .credit-card p { margin: 10px 0 20px; color: rgba(255,255,255,0.66); font-size: 13px; line-height: 1.5; }
    .credit-card .primary-button { background: var(--lime); color: var(--ink); width: 100%; }
    .steps { display: grid; gap: 10px; margin-top: 18px; }

    .messages-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; }
    .message-panel { padding: 24px; background: var(--cream); border-radius: var(--radius-xl); box-shadow: var(--shadow); }
    .notification-banner { display: flex; align-items: center; gap: 14px; padding: 17px; background: var(--ink); color: var(--white); border-radius: 24px; }
    .notification-icon { width: 48px; height: 48px; border-radius: 16px; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
    .notification-copy { flex: 1; }
    .notification-copy strong { display: block; }
    .notification-copy span { display: block; margin-top: 3px; color: rgba(255,255,255,0.6); font-size: 12px; }
    .notification-banner button { border: 0; background: var(--white); color: var(--ink); border-radius: 999px; padding: 11px 15px; font-size: 12px; font-weight: 900; }
    .message-list { display: grid; gap: 12px; margin-top: 18px; }
    .message-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(23,27,26,0.08);
      border-radius: 24px;
      background: var(--white);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 10px 24px rgba(48,62,18,0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .message-item:hover {
      transform: translateY(-2px);
      border-color: rgba(23,27,26,0.16);
      box-shadow: 0 14px 30px rgba(48,62,18,0.12);
    }
    .message-item:last-child { border-bottom: 1px solid rgba(23,27,26,0.08); }
    .message-item > span:last-child {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }
    .message-item-icon { width: 54px; height: 54px; flex: 0 0 auto; border-radius: 18px; display: grid; place-items: center; background: var(--lavender); }
    .message-item:nth-child(2) .message-item-icon { background: var(--lime); }
    .message-item-copy { min-width: 0; flex: 1; }
    .message-item-copy strong { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 15px; }
    .official { border-radius: 999px; padding: 3px 7px; background: rgba(23,27,26,0.09); color: var(--muted); font-size: 10px; }
    .message-item-copy p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .side-quote { background: var(--ink); color: var(--white); border-radius: var(--radius-xl); padding: 26px; min-height: 270px; display: flex; flex-direction: column; justify-content: space-between; }
    .side-quote blockquote { margin: 0; font-size: 28px; letter-spacing: -0.06em; line-height: 1.06; }
    .side-quote small { color: rgba(255,255,255,0.58); line-height: 1.5; }

    .profile-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
    .profile-card { padding: 28px; background: var(--cream); border-radius: var(--radius-xl); box-shadow: var(--shadow); text-align: center; position: sticky; top: 24px; }
    .profile-avatar { width: 104px; height: 104px; border-radius: 36px; object-fit: cover; border: 8px solid var(--lime-light); background: var(--lime); }
    .profile-card h2 { margin: 17px 0 4px; font-size: 25px; letter-spacing: -0.06em; }
    .handle { color: var(--muted); font-size: 13px; }
    .profile-bio { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 17px 0; }
    .profile-actions { display: grid; gap: 9px; }
    .profile-actions button,
    .profile-actions .profile-switch { min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--ink); font-weight: 850; }
    .profile-actions button:first-child { background: var(--ink); color: var(--white); border-color: var(--ink); }
    /* A link rather than a button, so it leaves the htmx shell for /claim. */
    .profile-actions .profile-switch { display: grid; place-items: center; text-decoration: none; }
    .profile-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 16px; }
    .profile-stat { padding: 12px; background: var(--white); border-radius: 16px; }
    .profile-stat strong { display: block; font-size: 22px; }
    .profile-stat span { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .profile-content { min-width: 0; }
    .profile-topline { display: flex; align-items: end; justify-content: space-between; margin-bottom: 16px; }
    .profile-topline h1 { margin: 0; font-size: 58px; letter-spacing: -0.07em; }
    .profile-level { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 800; font-size: 13px; }
    .level-track { width: 110px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.4); border: 1px solid rgba(23,27,26,0.15); overflow: hidden; }
    .level-track span { display: block; width: 45%; height: 100%; background: var(--ink); }
    .tabs { display: flex; gap: 7px; padding: 7px; background: rgba(255,255,255,0.36); border-radius: 999px; width: max-content; max-width: 100%; overflow-x: auto; }
    .tab { border: 0; border-radius: 999px; padding: 11px 16px; background: transparent; color: var(--muted); font-weight: 850; white-space: nowrap; }
    .tab.active { background: var(--ink); color: var(--white); }
    .profile-work-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-top: 20px; }
    .empty-state { grid-column: 1 / -1; min-height: 390px; display: grid; place-items: center; text-align: center; padding: 30px; background: var(--cream); border-radius: var(--radius-xl); box-shadow: var(--shadow); }
    .empty-state .mascot { width: 160px; margin: 0 auto; animation: none; }
    .empty-state h3 { margin: 12px 0 6px; font-size: 24px; letter-spacing: -0.05em; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 13px; }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(23,27,26,0.94);
      box-shadow: 0 18px 40px rgba(23,27,26,0.25);
    }
    .nav-items { display: flex; align-items: center; gap: 4px; }
    .nav-item {
      position: relative;
      width: 54px;
      height: 46px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,0.52);
      display: grid;
      place-items: center;
      transition: background 160ms ease, color 160ms ease;
    }
    .nav-item.active { background: rgba(255,255,255,0.12); color: var(--lime); }
    .nav-item:hover { color: var(--white); }
    .nav-item .dot { position: absolute; top: 7px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); border: 2px solid var(--ink); }
    .floating-create { width: 60px; height: 60px; border: 0; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; font-size: 31px; line-height: 1; box-shadow: 0 9px 22px rgba(181,214,90,0.3); transition: transform 160ms ease; }
    .floating-create:hover { transform: rotate(8deg) scale(1.05); }
    .bottom-spacer { height: 120px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: end; justify-content: center; background: rgba(23,27,26,0.52); padding: 20px; }
    .modal-backdrop.open { display: flex; animation: fadeIn 180ms ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: min(620px, 100%); background: var(--cream); border-radius: 32px; padding: 24px; box-shadow: 0 30px 90px rgba(23,27,26,0.3); animation: modalIn 220ms ease both; }
    @keyframes modalIn { from { transform: translateY(22px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 18px; }
    .modal-head h2 { margin: 0; font-size: 28px; letter-spacing: -0.06em; }
    .modal-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .close-button { width: 40px; height: 40px; border: 0; background: var(--white); border-radius: 50%; font-size: 23px; line-height: 1; }
    .modal-body { display: grid; gap: 12px; margin-top: 20px; }
    .modal-choice { width: 100%; padding: 15px; border-radius: 20px; border: 1px solid var(--line); background: var(--white); display: flex; align-items: center; gap: 13px; text-align: left; transition: transform 160ms ease, border-color 160ms ease; }
    .modal-choice:hover { transform: translateX(3px); border-color: var(--lime-dark); }
    .choice-icon { width: 44px; height: 44px; border-radius: 15px; background: var(--lime-light); display: grid; place-items: center; font-size: 22px; }
    .modal-choice strong { display: block; font-size: 14px; }
    .modal-choice span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .import-game-form { display: grid; gap: 14px; }
    .import-game-form[hidden], .create-choices[hidden] { display: none; }
    .import-dropzone { min-height: 156px; padding: 20px; border: 2px dashed rgba(151,189,56,0.52); border-radius: 22px; background: var(--mint); display: grid; place-items: center; align-content: center; gap: 6px; color: var(--ink); text-align: center; transition: background 160ms ease, border-color 160ms ease, transform 160ms ease; }
    .import-dropzone:hover { border-color: var(--lime-dark); transform: translateY(-1px); }
    .import-dropzone.dragging { border-color: var(--lime-dark); background: var(--lime-light); }
    .import-drop-icon { width: 42px; height: 42px; border-radius: 15px; display: grid; place-items: center; background: var(--ink); color: var(--lime); font-size: 21px; }
    .import-dropzone strong { font-size: 14px; }
    .import-dropzone small { color: var(--muted); font-size: 12px; }
    .import-sources { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .import-source { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); color: var(--ink); font-size: 12px; font-weight: 850; }
    .import-source:hover { border-color: var(--lime-dark); }
    .import-title-label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .import-title-label span { font-weight: 500; }
    .import-title { width: 100%; min-height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); color: var(--ink); }
    .work-flag { margin: 8px 0 0; padding: 8px 10px; border-radius: 12px; background: #ffe1d6; color: #8a2b12; font-size: 12px; font-weight: 750; line-height: 1.4; }
    .work-flag.muted { background: var(--mint); color: var(--muted); }
    .import-row { display: grid; grid-template-columns: 1fr 88px; gap: 9px; }
    .import-art { display: flex; gap: 9px; margin: 0; padding: 0; border: 0; }
    .import-art legend { margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .import-art label { position: relative; }
    .import-art input { position: absolute; opacity: 0; }
    .import-art .work-art::after { content: none; }
    .import-art .work-art { display: block; width: 44px; height: 44px; border-radius: 14px; border: 2px solid transparent; }
    .import-art input:checked + .work-art { border-color: var(--ink); }
    .import-art input:focus-visible + .work-art { outline: 2px solid var(--lime-dark); outline-offset: 2px; }
    .import-file-input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }
    .import-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .import-back { min-height: 42px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 850; }
    .import-submit { min-height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 13px; font-weight: 850; }
    .import-submit:disabled { opacity: 0.56; cursor: wait; }
    .import-progress { width: 100%; height: 8px; margin: -4px 0 0; accent-color: var(--lime-dark); }
    .import-status { min-height: 17px; margin: -5px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

    /* Game host. Full-bleed and above the nav, so the game gets the whole
       viewport rather than a card-sized box with beeplay chrome around it.
       Sits below .toast so notifications stay visible over a running game. */
    #gameHost { position: fixed; inset: 0; z-index: 60; background: var(--ink); }
    #gameHost iframe { width: 100%; height: 100%; border: 0; display: block; }
    /* The card's own Ⅱ is underneath this overlay and unreachable, so the stop
       control belongs to the host. */
    #gameStop { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; z-index: 1; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(23,27,26,0.62); color: var(--white); font-size: 20px; line-height: 1; }
    .toast { position: fixed; z-index: 80; left: 50%; bottom: 104px; transform: translate(-50%, 16px); padding: 12px 16px; color: var(--white); background: var(--ink); border-radius: 999px; font-size: 13px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 981px) {
      .bottom-nav { display: none; }
      .bottom-spacer { display: none; }
      .desktop-create { display: inline-flex; }
      .modal-backdrop { align-items: center; padding: 48px; }
      .modal { border-radius: 36px; }
    }

    @media (max-width: 980px) {
      .desktop-nav { display: none; }
      .home-grid, .discover-layout, .create-layout, .messages-grid, .profile-layout { grid-template-columns: 1fr; }
      .hero-panel { min-height: 620px; }
      .dashboard-panel { min-height: auto; }
      .hero-title { font-size: 72px; }
      .view-header h1, .profile-topline h1 { font-size: 48px; }
      .feature-title { font-size: 56px; }
      .promo-card h2 { font-size: 42px; }
      .create-panel h1 { font-size: 62px; }
      .idea-box textarea { font-size: 30px; }
      .profile-card { position: static; display: grid; grid-template-columns: 100px 1fr; text-align: left; gap: 0 18px; align-items: center; }
      .profile-card .profile-avatar { grid-row: span 3; }
      .profile-card h2, .profile-card .handle, .profile-card .profile-bio { margin-left: 0; }
      .profile-actions, .profile-stats { grid-column: 1 / -1; }
      .profile-stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      body { overflow-x: hidden; }
      .app-shell { padding: 18px 14px 24px; }
      .topbar { margin-bottom: 20px; }
      .topbar-actions .credit-pill { display: none; }
      .brand-copy strong { font-size: 18px; }
      .brand-mark { width: 42px; height: 42px; }
      .hero-panel { padding: 28px 22px; min-height: 620px; }
      .hero-panel::after { right: 18px; top: 20px; width: 90px; height: 90px; }
      .hero-title { font-size: 54px; }
      .hero-description { font-size: 17px; }
      .mascot-stage { min-height: 240px; }
      .mascot { width: 230px; }
      .view-header { display: grid; gap: 15px; }
      .view-header h1, .profile-topline h1 { font-size: 44px; }
      .search-box { width: 100%; }
      .feature-card, .promo-card { min-height: 350px; }
      .feature-title { font-size: 48px; }
      .promo-card h2 { font-size: 38px; }
      .feature-bottom { align-items: end; }
      .feature-stats { max-width: 55%; gap: 8px; }
      .feature-cta { flex: 0 0 auto; }
      .work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .create-panel h1 { font-size: 52px; }
      .create-panel { padding: 24px 18px; }
      .create-panel > p { font-size: 14px; }
      .idea-box { min-height: 235px; padding: 15px; }
      .idea-box textarea { min-height: 132px; font-size: 24px; }
      .inspiration-card { align-items: flex-start; }
      .inspiration-copy strong { white-space: normal; }
      .inspiration-card .remix-button { align-self: center; }
      .notification-banner { align-items: flex-start; }
      .notification-banner button { flex: 0 0 auto; }
      .message-panel, .side-quote { padding: 18px; }
      .profile-card { display: block; text-align: center; }
      .profile-topline { display: grid; gap: 12px; }
      .profile-level { justify-content: flex-start; }
      .profile-work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .bottom-nav { bottom: max(10px, env(safe-area-inset-bottom)); }
      .nav-item { width: 47px; }
      .floating-create { width: 56px; height: 56px; }
      .modal-backdrop { padding: 12px; }
      .modal { max-height: calc(100dvh - 24px); overflow: auto; padding: 20px; border-radius: 28px; }
    }
    @media (max-width: 390px) {
      .nav-item { width: 41px; }
      .bottom-nav { gap: 3px; padding: 6px; }
      .floating-create { width: 52px; height: 52px; }
      .week-row { gap: 3px; }
      .day { font-size: 9px; }
      .hero-title { font-size: 50px; }
      .create-panel h1 { font-size: 48px; }
    }

    /* The first release is previewed as a phone-first product on every screen. */

      overflow-x: hidden;
    }

    body.mobile-preview .desktop-create { display: none; }

    body.mobile-preview .brand-copy strong { font-size: 18px; }
    body.mobile-preview .brand-mark { width: 42px; height: 42px; }

      position: absolute;
      top: 13%;
      right: 13%;
      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
    }
    body.mobile-preview .scene-ground {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 17%;
      height: 30%;
      border-radius: 50% 50% 0 0;
      background: rgba(255,255,255,0.48);
      transform: rotate(-5deg);
    }
    body.mobile-preview .scene-piece {
      position: absolute;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-weight: 950;
      filter: drop-shadow(0 15px 10px rgba(23,27,26,0.13));
    }
    body.mobile-preview .scene-piece.tree {
      left: 15%;
      bottom: 31%;
      width: 74px;
      height: 118px;
      border-radius: 52% 52% 18% 18%;
      background: #7fbf55;
      clip-path: polygon(50% 0, 92% 44%, 72% 44%, 100% 72%, 68% 72%, 82% 100%, 18% 100%, 32% 72%, 0 72%, 28% 44%, 8% 44%);
    }
    body.mobile-preview .scene-piece.ball {
      left: 46%;
      top: 28%;
      width: 86px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--orange);
      animation: gameFloat 3.5s ease-in-out infinite;
    }
    body.mobile-preview .scene-piece.ball::after {
      content: "PLAY";
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    body.mobile-preview .scene-piece.emoji {
      left: 32%;
      top: 25%;
      font-size: 128px;
      line-height: 1;
      animation: gameFloat 3.5s ease-in-out infinite;
    }
    body.mobile-preview .scene-piece.keyboard {
      left: 13%;
      right: 13%;
      bottom: 29%;
      height: 94px;
      border-radius: 22px;
      background: var(--ink);
      transform: rotate(-7deg);
    }
    body.mobile-preview .scene-piece.keyboard::before {
      content: "A  S  D  F  J  K  L";
      color: var(--lime);
      font-size: 18px;
      letter-spacing: 4px;
      white-space: nowrap;
    }
    body.mobile-preview .scene-piece.orbit {
      left: 30%;
      top: 23%;
      width: 160px;
      height: 160px;
      border: 3px solid rgba(23,27,26,0.36);
      border-radius: 50%;
      transform: rotate(-22deg);
    }
    body.mobile-preview .scene-piece.orbit::before,
    body.mobile-preview .scene-piece.orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--ink);
    }
    body.mobile-preview .scene-piece.orbit::before { width: 30px; height: 30px; top: 10px; right: 10px; }
    body.mobile-preview .scene-piece.orbit::after { width: 16px; height: 16px; left: 18px; bottom: 18px; background: var(--orange); }
    @keyframes gameFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-14px) rotate(5deg); }
    }
    body.mobile-preview .game-copy {
      position: absolute;
      z-index: 3;
      left: 20px;
      right: 86px;
      bottom: 28px;
      color: var(--white);
    }
    body.mobile-preview .game-copy h2 {
      margin: 0;
      font-size: 31px;
      line-height: 0.98;
      letter-spacing: -0.065em;
    }
    body.mobile-preview .game-copy p {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      line-height: 1.4;
    }
    body.mobile-preview .game-author {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      font-size: 12px;
      font-weight: 800;
    }
    body.mobile-preview .game-author::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.35);
    }
    body.mobile-preview .game-actions {
      position: absolute;
      z-index: 4;
      right: 16px;
      bottom: 26px;
      display: grid;
      justify-items: center;
      gap: 13px;
    }
    body.mobile-preview .game-action {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(23,27,26,0.78);
      color: var(--white);
      font-size: 19px;
      transition: transform 160ms ease, background 160ms ease;
    }
    body.mobile-preview .game-action:hover,
    body.mobile-preview .game-action.active {
      background: var(--lime);
      color: var(--ink);
      transform: scale(1.06);
    }
    body.mobile-preview .game-action small {
      display: block;
      margin-top: 3px;
      color: inherit;
      font-size: 9px;
      font-weight: 850;
    }
    body.mobile-preview .play-game {
      width: 62px;
      height: 62px;
      border: 7px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      background: var(--lime);
      color: var(--ink);
      font-size: 24px;
      box-shadow: 0 12px 24px rgba(23,27,26,0.2);
    }
    body.mobile-preview .home-grid,
    body.mobile-preview .discover-layout,
    body.mobile-preview .create-layout,
    body.mobile-preview .messages-grid,
    body.mobile-preview .profile-layout { grid-template-columns: 1fr; }
    body.mobile-preview .hero-panel { padding: 28px 22px; min-height: 620px; }
    body.mobile-preview .hero-panel::after { right: 18px; top: 20px; width: 90px; height: 90px; }
    body.mobile-preview .hero-title { font-size: 54px; }
    body.mobile-preview .hero-description { font-size: 17px; }
    body.mobile-preview .mascot-stage { min-height: 240px; }
    body.mobile-preview .mascot { width: 230px; }
    body.mobile-preview .view-header { display: grid; gap: 15px; }
    body.mobile-preview .view-header h1,
    body.mobile-preview .profile-topline h1 { font-size: 44px; }
    body.mobile-preview .search-box { width: 100%; }
    body.mobile-preview .feature-card,
    body.mobile-preview .promo-card { min-height: 350px; }
    body.mobile-preview .feature-title { font-size: 48px; }
    body.mobile-preview .promo-card h2 { font-size: 38px; }
    body.mobile-preview .feature-bottom { align-items: end; }
    body.mobile-preview .feature-stats { max-width: 55%; gap: 8px; }
    body.mobile-preview .feature-cta { flex: 0 0 auto; }
    body.mobile-preview .work-grid,
    body.mobile-preview .profile-work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    body.mobile-preview .create-panel { padding: 24px 18px; }
    body.mobile-preview .create-panel h1 { font-size: 52px; }
    body.mobile-preview .create-panel > p { font-size: 14px; }
    body.mobile-preview .idea-box { min-height: 235px; padding: 15px; }
    body.mobile-preview .idea-box textarea { min-height: 132px; font-size: 24px; }
    body.mobile-preview .inspiration-card { align-items: flex-start; }
    body.mobile-preview .inspiration-copy strong { white-space: normal; }
    body.mobile-preview .inspiration-card .remix-button { align-self: center; }
    body.mobile-preview .notification-banner { align-items: flex-start; }
    body.mobile-preview .notification-banner button { flex: 0 0 auto; }
    body.mobile-preview .message-panel,
    body.mobile-preview .side-quote { padding: 18px; }
    body.mobile-preview .profile-card { display: block; text-align: center; position: static; }
    body.mobile-preview .profile-topline { display: grid; gap: 12px; }
    body.mobile-preview .profile-level { justify-content: flex-start; }
    body.mobile-preview .nav-item { width: 47px; }
    body.mobile-preview .floating-create { width: 56px; height: 56px; }
    body.mobile-preview .modal-backdrop { align-items: end; padding: 12px; }
    body.mobile-preview .modal {
      max-height: calc(100dvh - 24px);
      overflow: auto;
      padding: 20px;
      border-radius: 28px;
    }
    @media (min-width: 431px) {
      body.mobile-preview .app-shell {
        min-height: calc(100dvh - 36px);
        margin-top: 18px;
        margin-bottom: 18px;
        border-radius: 34px;
        box-shadow: 0 20px 80px rgba(48, 62, 18, 0.2);
      }
    }

    /* Feed lock while a game is running. These live at the end of the sheet on
       purpose: body.mobile-preview .home-feed has equal specificity and is
       declared later, so an earlier rule here would lose on source order. */
    body.playing { overflow: hidden; }
    body.playing .home-feed { scroll-snap-type: none; overflow-y: hidden; touch-action: none; }
    /* Beeplay's chrome is hidden while a game runs. The game's own topbar and
       its four-stage journey nav are the session's controls and progress
       indicator, so ours would only duplicate and crowd them. Hiding the
       bottom nav also removes the stray-tap route out of a running session. */
    /* Identity picker. Reached by a plain link, so it is a full document
       rendered inside the usual shell rather than an htmx swap. */
    .claim-layout { padding: 20px 16px 40px; display: grid; gap: 20px; }
    .claim-head h1 { margin: 0 0 6px; font-size: 24px; }
    .claim-head p { margin: 0; color: #6b6f6e; font-size: 14px; line-height: 1.5; }
    .claim-notice {
      margin-top: 12px; padding: 10px 14px; border-radius: 14px;
      background: #fff3d6; color: #7a5a12; font-size: 13px; line-height: 1.5;
    }
    .claim-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .claim-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      width: 100%; padding: 16px; border-radius: 20px; background: #fff;
      border: 1px solid #ecebe8; text-decoration: none; color: inherit;
      font: inherit; text-align: left; transition: transform .12s ease, border-color .12s ease;
    }
    .claim-action { margin: 0; }
    .claim-card:hover { transform: translateY(-2px); border-color: var(--lime, #d7f36b); }
    .claim-card.mine { border-color: #171b1a; border-width: 2px; }
    /* Taken identities are a div, not a link, so there is nothing to tap. */
    .claim-card.taken { opacity: .45; }
    .claim-card.taken:hover { transform: none; border-color: #ecebe8; }
    .claim-avatar { width: 56px; height: 56px; border-radius: 18px; }
    .claim-card strong { font-size: 15px; }
    .claim-handle { font-size: 12px; color: #9a9d9b; }
    .claim-bio { margin: 0; font-size: 12px; color: #6b6f6e; line-height: 1.45; }
    .claim-state { margin-top: 4px; font-size: 11px; color: #9a9d9b; }
    .claim-card.mine .claim-state { color: #171b1a; font-weight: 600; }

    body.playing .topbar,
    body.playing .bottom-nav,
    body.playing .bottom-spacer { display: none; }
  </style>
</head>
<body class="mobile-preview{% if view == 'home' %} feed-mode{% endif %}"
      hx-target="#viewport" hx-swap="innerHTML" hx-push-url="true"
      data-load-timeout-s="{{ load_timeout_s }}">
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-view-target="home" hx-get="/" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">
          <img src="{{ asset('icons/beeplay-logo.png') }}" alt="" />
        </span>
        <span class="brand-copy"><strong>beeplay</strong><span>蜂玩 · make it playful</span></span>
      </button>
      <nav class="desktop-nav" aria-label="桌面主导航">
        <button class="nav-link{% if view == 'home' %} active{% endif %}" data-view-target="home" hx-get="/">首页</button>
        <button class="nav-link{% if view == 'discover' %} active{% endif %}" data-view-target="discover" hx-get="/discover">探索</button>
        <button class="nav-link{% if view == 'create' %} active{% endif %}" data-view-target="create" hx-get="/create">创建</button>
        <button class="nav-link{% if view == 'messages' %} active{% endif %}" data-view-target="messages" hx-get="/messages">消息</button>
        <button class="nav-link{% if view == 'profile' %} active{% endif %}" data-view-target="profile" hx-get="/profile">个人</button>
      </nav>
      <button class="desktop-create" data-action="create" aria-label="开始创建"><span>+</span><span>开始创建</span></button>
      <div class="topbar-actions">
        <button class="credit-pill" id="creditPill" aria-label="查看蜂蜜积分"><span class="credit-dot">✦</span><span>1,000</span></button>
        <button class="icon-button" id="notificationButton" data-view-target="messages" hx-get="/messages" aria-label="查看消息">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/>
          </svg>
        </button>
        <button class="avatar-button" data-view-target="profile" hx-get="/profile" aria-label="查看个人主页">
          <img src="{{ avatar(current_user.avatar_fill) if current_user else avatar() }}" alt="{{ current_user.name if current_user else '选择身份' }}" />
        </button>
      </div>
    </header>

    <!-- hx-history-elt scopes history snapshots and restores to the viewport.
         Without it htmx's history element is <body>, and a Back press restores
         a snapshot over the whole body: app.js re-executes and registers a
         second set of delegated listeners (every click then fires twice, so
         like/save toggle on then off and never stick), while the first set is
         left pointing at a detached #gameHost, #createModal and #toast. The
         snapshot also deserializes a stale <iframe>, so the next play mounts a
         second copy of the game beside a zombie. Restoring only what htmx owns
         leaves the body-level hosts — the whole point of them — untouched. -->
    <main class="page" id="viewport" hx-history-elt>
{% include "views/" ~ view ~ ".html" %}
    </main>

    <div class="bottom-spacer"></div>
  </div>

  <nav class="bottom-nav" aria-label="主导航">
    <div class="nav-items">
      <button class="nav-item{% if view == 'home' %} active{% endif %}" data-view-target="home" hx-get="/" aria-label="首页">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12.5 12 4l9 8.5"/><path d="M5 10.8V20h14v-9.2"/><path d="M9 20v-5h6v5"/></svg>
      </button>
      <button class="nav-item{% if view == 'discover' %} active{% endif %}" data-view-target="discover" hx-get="/discover" aria-label="探索">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2.1 4.7-4.7 2.1 2.1-4.7 4.7-2.1Z"/></svg>
      </button>
      <button class="floating-create" data-action="create" aria-label="开始创作">+</button>
      <button class="nav-item{% if view == 'messages' %} active{% endif %}" data-view-target="messages" hx-get="/messages" aria-label="消息"><span style="font-size: 22px;">♧</span><span class="dot" aria-hidden="true"></span></button>
      <button class="nav-item{% if view == 'profile' %} active{% endif %}" data-view-target="profile" hx-get="/profile" aria-label="个人"><span style="font-size: 22px;">●</span></button>
    </div>
  </nav>

  <div class="modal-backdrop" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <div class="modal">
      <div class="modal-head"><div><h2 id="createModalTitle">你想玩什么？</h2><p id="createModalDescription">选择一个入口，马上开始你的 Bee。</p></div><button class="close-button" id="closeModal" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <div class="create-choices" id="createChoices">
          <button class="modal-choice" data-modal-choice="idea"><span class="choice-icon">✦</span><span><strong>从一个想法开始</strong><span>输入一句话，让 Beeplay 帮你建立第一个版本。</span></span></button>
          <button class="modal-choice" data-modal-choice="habit"><span class="choice-icon">☀</span><span><strong>做一个习惯计划</strong><span>把想坚持的事变成每天都想打开的小任务。</span></span></button>
          <button class="modal-choice" data-modal-choice="remix"><span class="choice-icon">↗</span><span><strong>Remix 一个作品</strong><span>从社区里的灵感出发，做成属于你的版本。</span></span></button>
          <button class="modal-choice" data-modal-choice="import"><span class="choice-icon">▣</span><span><strong>导入一个完成的小游戏</strong><span>带入已有的 HTML 游戏，加入首页游戏流。</span></span></button>
        </div>
        <form class="import-game-form" id="importGameForm" hidden>
          <input class="import-file-input" id="importGameZip" type="file" accept=".zip,application/zip" />
          <input class="import-file-input" id="importGameFolder" type="file" webkitdirectory multiple />
          <button class="import-dropzone" id="importDropzone" type="button"><span class="import-drop-icon">▣</span><strong id="importSelection">拖入一个 zip 游戏包</strong><small>或从下方选择构建后的 dist 文件夹</small></button>
          <div class="import-sources"><button class="import-source" type="button" id="chooseGameFolder">选择 dist 文件夹</button><button class="import-source" type="button" id="chooseGameZip">选择 zip 包</button></div>
          <label class="import-title-label" for="importGameTitle">游戏名称<input class="import-title" id="importGameTitle" maxlength="120" placeholder="例如：Block Drop" required /></label>
          <div class="import-row">
            <label class="import-title-label" for="importGameCategory">分类 <span>随便写，能 meme</span><input class="import-title" id="importGameCategory" maxlength="24" list="importCategoryIdeas" placeholder="例如：放松、脑洞、brainrot" required /></label>
            <label class="import-title-label import-emoji-label" for="importGameEmoji">图标<input class="import-title" id="importGameEmoji" maxlength="8" value="🎮" required /></label>
          </div>
          <datalist id="importCategoryIdeas"><option value="relax"></option><option value="focus"></option><option value="physics"></option><option value="puzzle"></option><option value="brainrot"></option></datalist>
          <fieldset class="import-art"><legend>封面颜色</legend>
            <label><input type="radio" name="importGameArt" value="art-one" checked /><span class="work-art art-one"></span></label>
            <label><input type="radio" name="importGameArt" value="art-two" /><span class="work-art art-two"></span></label>
            <label><input type="radio" name="importGameArt" value="art-three" /><span class="work-art art-three"></span></label>
            <label><input type="radio" name="importGameArt" value="art-four" /><span class="work-art art-four"></span></label>
          </fieldset>
          <label class="import-title-label" for="importGameDescription">一句话介绍 <span>可选</span><input class="import-title" id="importGameDescription" maxlength="200" placeholder="这个游戏好玩在哪？" /></label>
          <div class="import-footer"><button class="import-back" type="button" id="importBack">← 返回</button><button class="import-submit" type="submit" id="importGameSubmit">加入游戏流 →</button></div>
          <progress class="import-progress" id="importProgress" max="1" hidden></progress>
          <p class="import-status" id="importStatus" role="status"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- Persistent game host. Body-level on purpose: anything inside #viewport is
       destroyed by an htmx nav swap, which would kill a session mid-brew. -->
  <div id="gameHost" hidden>
    <!-- Pauses rather than ends: the iframe stays mounted and keeps its game
         state, the host just hides. Ending a session outright is a separate,
         deliberate action (switching to another game). -->
    <button id="gameStop" aria-label="暂停并返回信息流" title="暂停并返回">×</button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="{{ asset('vendor/htmx.min.js') }}"></script>
  <script src="{{ asset('js/app.js') }}"></script>
</body>
</html>
